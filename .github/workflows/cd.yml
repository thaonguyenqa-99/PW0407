
name: CD Pipeline Practice

on:
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate deployment to Staging
        run: echo "Application is ready on Staging"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests on Staging
        run: npx playwright test tests/DemoQAByMyself/specs/textbox.spec.ts

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cd-playwright-report
          path: playwright-report/
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: e2e-tests
    steps:
      - name: Release
        run: echo "E2E tests passed. Ready for release!"
